name: 🚀 Production CI/CD — Auto Deploy to iNet VPS

on:
  push:
    branches:
      - demo
      - dev
      - main
      - 'feat/**'
      - 'fix/**'
      - 'loi/**'
      - 'nam/**'
      - 'phuoc/**'
      - 'dat/**'
  pull_request:
    branches:
      - demo
      - dev
      - main
      - 'feat/**'
      - 'fix/**'
      - 'loi/**'
      - 'nam/**'
      - 'phuoc/**'
      - 'dat/**'
  workflow_dispatch:

# Tối ưu concurrency theo từng nhánh để test chạy song song, hủy build cũ khi push dồn dập
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1. CI: Bắt buộc chạy FULL Test Case & Test Rules đạt 100% (Chạy trên mọi nhánh push)
  # ============================================================
  test-and-verify:
    name: 🧪 Full Test Suites & Architecture Rules Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Backend Dependencies
        working-directory: backend
        run: npm install --legacy-peer-deps

      - name: 🏗️ Typecheck & Build Verification (Fast Fail)
        working-directory: backend
        run: npm run build

      - name: 🧪 Run Playbook & Architecture Test Rules Audit
        working-directory: backend
        run: npm run test:rules

      - name: 🐳 Run Full Test Cases & Test Container (Strict Quality Gate)
        working-directory: backend
        run: |
          npm run lint || true
          npm run test:ci

      - name: 🤖 Verify Bot Simulator Tests & Docker Image Build
        run: |
          npm --prefix bot-simulator ci
          npm --prefix bot-simulator test
          docker build -t wdp301-bot-simulator:ci -f bot-simulator/Dockerfile bot-simulator

  # ============================================================
  # 2. CD: Tự động SSH vào VPS và triển khai Production (Chỉ cho main, dev, demo khi FULL TEST PASS)
  # ============================================================
  deploy-to-vps:
    name: 🚢 Deploy to Cloud VPS
    needs: test-and-verify
    # Chặn an toàn: Chỉ deploy lên VPS khi push vào dev, main, demo; các nhánh cá nhân chỉ chạy CI Test
    if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/demo')
    concurrency:
      group: production-inet-vps
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands on iNet VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '103.75.187.86' }}
          port: ${{ secrets.VPS_PORT || 24700 }}
          username: ${{ secrets.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            echo "=================================================="
            echo "🚀 [CI/CD] Bắt đầu tự động Deploy dự án WDP301..."
            echo "=================================================="

            # 1. Tự động cài đặt Docker & Docker Compose nếu VPS chưa có
            if ! command -v docker &> /dev/null; then
              echo "🐳 Docker chưa cài đặt. Đang tiến hành cài đặt Docker Engine..."
              curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
              sh /tmp/get-docker.sh
              systemctl enable docker
              systemctl start docker
            fi

            # 2. Tự động kích hoạt 4GB Swap chống tràn RAM cho Kafka & Microservices
            CURRENT_SWAP=$(free -m | awk '/^Swap:/ {print $2}')
            if [ "$CURRENT_SWAP" -eq 0 ]; then
              echo "💾 Đang thiết lập 4GB Swap an toàn cho VPS 6GB RAM..."
              fallocate -l 4G /swapfile
              chmod 600 /swapfile
              mkswap /swapfile
              swapon /swapfile
              echo '/swapfile none swap sw 0 0' >> /etc/fstab
            fi

            # 3. Mở cổng tường lửa cơ bản (nếu bật UFW)
            if command -v ufw &> /dev/null; then
              ufw allow 24700/tcp || true
              ufw allow 80/tcp || true
              ufw allow 443/tcp || true
              ufw allow 3000/tcp || true
              ufw allow 4000/tcp || true
            fi

            # 4. Quản lý source code qua Git
            APP_DIR="/var/www/wdp301"
            TARGET_BRANCH="${{ github.ref_name }}"
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "📂 Thư mục dự án chưa tồn tại, đang clone từ GitHub..."
              mkdir -p /var/www
              git clone -b "$TARGET_BRANCH" https://github.com/SEP490-Team3-FA26/SEP490-SE06.git "$APP_DIR" || git clone https://github.com/SEP490-Team3-FA26/SEP490-SE06.git "$APP_DIR"
            fi

            # 2. Đồng bộ mã nguồn mới nhất từ GitHub
            cd "$APP_DIR"
            git config --global --add safe.directory "$APP_DIR" || true
            git fetch --all --prune
            echo "🌿 Đang checkout và đồng bộ tuyệt đối nhánh: $TARGET_BRANCH"
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH" || git checkout "$TARGET_BRANCH" || git checkout demo
            git reset --hard "origin/$TARGET_BRANCH" || git reset --hard origin/demo || git reset --hard HEAD
            git clean -fd

            # 3. Phân quyền và thực thi script deploy production hoàn chỉnh
            chmod +x "$APP_DIR/scripts/deploy-prod.sh"
            bash "$APP_DIR/scripts/deploy-prod.sh"
