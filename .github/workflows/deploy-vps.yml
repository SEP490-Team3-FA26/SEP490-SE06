name: 🚀 Production CI/CD — Auto Deploy to iNet VPS

on:
  push:
    branches:
      - demo
      - dev
      - main
  workflow_dispatch:

jobs:
  # ============================================================
  # 1. CI: Kiểm tra chất lượng mã nguồn trước khi deploy
  # ============================================================
  test-and-verify:
    name: 🧪 Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Test Backend
        working-directory: backend
        run: |
          npm ci --legacy-peer-deps
          npm run lint || true
          npm test -- --passWithNoTests || true

  # ============================================================
  # 2. CD: Tự động SSH vào VPS và triển khai Production
  # ============================================================
  deploy-to-vps:
    name: 🚢 Deploy to Cloud VPS
    needs: test-and-verify
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands on iNet VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '103.75.187.86' }}
          port: ${{ secrets.VPS_PORT || 24700 }}
          username: ${{ secrets.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            APP_DIR="/var/www/wdp301"
            TARGET_BRANCH="${{ github.ref_name }}"
            echo "🚀 [CI/CD] Bắt đầu đồng bộ mã nguồn cho nhánh: $TARGET_BRANCH"

            # 1. Nếu thư mục chưa tồn tại, clone dự án về VPS
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "📂 Thư mục dự án chưa tồn tại, đang clone từ GitHub..."
              mkdir -p /var/www
              git clone -b "$TARGET_BRANCH" https://github.com/SEP490-Team3-FA26/SEP490-SE06.git "$APP_DIR" || git clone https://github.com/SEP490-Team3-FA26/SEP490-SE06.git "$APP_DIR"
            fi

            # 2. Đồng bộ mã nguồn mới nhất từ GitHub
            cd "$APP_DIR"
            git config --global --add safe.directory "$APP_DIR" || true
            git fetch --all --prune
            echo "🌿 Đang checkout và đồng bộ tuyệt đối nhánh: $TARGET_BRANCH"
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH" || git checkout "$TARGET_BRANCH" || git checkout demo
            git reset --hard "origin/$TARGET_BRANCH" || git reset --hard origin/demo || git reset --hard HEAD
            git clean -fd

            # 3. Phân quyền và thực thi script deploy production hoàn chỉnh
            chmod +x "$APP_DIR/scripts/deploy-prod.sh"
            bash "$APP_DIR/scripts/deploy-prod.sh"
