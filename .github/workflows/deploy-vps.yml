name: 🚀 Production CI/CD — Auto Deploy to iNet VPS

on:
  push:
    branches:
      - demo
      - dev
      - main
  workflow_dispatch:

jobs:
  # ============================================================
  # 1. CI: Kiểm tra chất lượng mã nguồn trước khi deploy
  # ============================================================
  test-and-verify:
    name: 🧪 Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Test Backend
        working-directory: backend
        run: |
          npm ci --legacy-peer-deps
          npm run lint || true
          npm test -- --passWithNoTests || true

  # ============================================================
  # 2. CD: Tự động SSH vào VPS và triển khai Production
  # ============================================================
  deploy-to-vps:
    name: 🚢 Deploy to Cloud VPS
    needs: test-and-verify
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands on iNet VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '103.75.187.86' }}
          port: ${{ secrets.VPS_PORT || 24700 }}
          username: ${{ secrets.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            git config --global --add safe.directory /var/www/wdp301 || true
            cd /var/www/wdp301 && git reset --hard && git fetch origin ${{ github.ref_name }} && git checkout ${{ github.ref_name }} && git pull origin ${{ github.ref_name }}
            chmod +x /var/www/wdp301/scripts/deploy-prod.sh
            bash /var/www/wdp301/scripts/deploy-prod.sh

