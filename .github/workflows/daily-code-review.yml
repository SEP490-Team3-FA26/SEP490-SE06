name: 🕵️ Daily Code Review & Team Digest

# Tự động chạy định kỳ hằng ngày trên GitHub Cloud (hoạt động 24/7 kể cả khi tắt máy tính)
on:
  schedule:
    # Chạy vào 16:00 UTC mỗi ngày = 23:00 giờ Việt Nam (GMT+7)
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  daily-code-review:
    name: 📊 Quét & Đánh Giá Chất Lượng Code Cả Team
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Toàn Bộ Lịch Sử Git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Tải đầy đủ lịch sử commit và remote branches

      - name: 🟢 Cài Đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔍 Chạy Script Phân Tích & Xuất Báo Cáo Code Review
        run: |
          node .github/workflows/scripts/daily-review.js

      - name: 📤 Lưu Báo Cáo Vào GitHub Artifacts (Lưu trữ 30 ngày)
        uses: actions/upload-artifact@v4
        with:
          name: daily-code-review-report
          path: .reports/daily_report.html
          retention-days: 30

      - name: 📧 Gửi Báo Cáo Trực Tiếp Đến Email Quản Trị Viên
        if: env.SMTP_USER != '' && env.SMTP_PASS != ''
        uses: dawidd6/action-send-mail@v3
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "[WDP301/SEP490] Báo Cáo Code Review Hằng Ngày - ${{ github.repository }}"
          to: de180577tranhongphuoc@gmail.com
          from: "WDP301 Code Review Bot <${{ secrets.SMTP_USER }}>"
          html_body: file://.reports/daily_report.html
          convert_markdown: false
