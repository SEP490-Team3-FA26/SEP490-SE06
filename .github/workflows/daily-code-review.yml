name: Daily Automated Code Review & Email Report

on:
  schedule:
    # Chạy tự động vào 18:00 giờ Việt Nam (UTC+7) mỗi ngày = 11:00 UTC
    - cron: '0 11 * * *'
  # Cho phép kích hoạt thủ công bất cứ lúc nào từ tab Actions trên GitHub
  workflow_dispatch:

jobs:
  daily-review:
    name: Quét Code và Gửi Báo Cáo Email
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Phân tích các Commit và Đánh giá Quy chuẩn (24 giờ qua)
        id: analyze
        run: |
          node .github/scripts/daily-review.js

      - name: Gửi Email Báo Cáo
        if: env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != ''
        uses: dawidd6/action-send-mail@v3
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[Báo Cáo Tự Động] Code Review Hằng Ngày - ${{ github.repository }}"
          to: de180577tranhongphuoc@gmail.com
          from: "GitHub Actions Bot <${{ secrets.MAIL_USERNAME }}>"
          html_body: file://.reports/daily_report.html

      - name: Đăng tải Báo Cáo lên GitHub Step Summary
        if: always()
        run: |
          if [ -f .reports/daily_report.html ]; then
            cat .reports/daily_report.html >> $GITHUB_STEP_SUMMARY
          fi
