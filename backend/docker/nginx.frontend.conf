map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

log_format wdp301_access escape=json
    '{"time":"$time_iso8601","service":"frontend","level":"info",'
    '"client_ip":"$remote_addr","method":"$request_method","path":"$uri",'
    '"status":$status,"bytes_sent":$body_bytes_sent,'
    '"request_time":"$request_time","upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time"}';

access_log /dev/stdout wdp301_access;
error_log /dev/stderr warn;

# 1. Chặn toàn bộ truy cập trực tiếp bằng IP VPS (Chống Bypass Cloudflare WAF)
server {
    listen 3000 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Cho phép healthcheck nội bộ Docker container
    location = /health {
        access_log off;
        return 200 'OK';
    }

    # Drop kết nối ngay lập tức nếu truy cập qua IP VPS trực tiếp (Bypass Cloudflare)
    location / {
        return 444;
    }
}

# 2. Máy chủ chính cho tên miền được bảo vệ qua Cloudflare
server {
    listen 3000;
    listen 443 ssl;
    server_name abcpharmacy.store www.abcpharmacy.store;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Docker Internal DNS resolver để tự động phân giải IP động của container (chống 502 Bad Gateway)
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend_upstream http://backend-svc:4000;
    set $dozzle_upstream http://dozzle-svc:8080;
    set $grafana_upstream http://grafana-svc:3000;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Chặn truy cập Swagger API Documentation từ bên ngoài trên Production
    location /api/docs {
        return 404;
    }

    # Chuyển hướng /dozzle sang /dozzle/
    location = /dozzle {
        return 301 /dozzle/;
    }

    # Dedicated proxy location cho Dozzle (Real-time Container Logs)
    location ^~ /dozzle/ {
        proxy_pass $dozzle_upstream;
        proxy_http_version 1.1;

        # WebSocket & Log streaming
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # Tắt buffering cho Server-Sent Events (SSE) logs thời gian thực
        proxy_buffering off;
        chunked_transfer_encoding off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Chuyển hướng /grafana sang /grafana/
    location = /grafana {
        return 301 /grafana/;
    }

    # Dedicated proxy location cho Grafana Dashboard
    location ^~ /grafana/ {
        proxy_pass $grafana_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_read_timeout 86400s;
    }

    # Dedicated proxy location for Server-Sent Events (SSE)
    location /api/events/sse {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # Disable buffering & cache for real-time streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
        proxy_set_header X-Accel-Buffering no;
    }

    # Endpoint chuyên biệt cho trạm IoT ESP32-S3 (Tắt access_log chống spam & giữ kết nối 24/7)
    location = /api/sensor {
        access_log off;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # Tắt toàn bộ buffering cho luồng Realtime 1Hz
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }
}
