<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC Pharmacy Mobile App - Reviewer UI Gallery (68 Screens & Modals)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #090D16;
      --bg-panel: #0F172A;
      --bg-panel-elevated: #1E293B;
      --bg-card: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-focus: #0EA5E9;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --primary: #0EA5E9;
      --primary-gradient: linear-gradient(135deg, #0EA5E9 0%, #06B6D4 50%, #10B981 100%);
      --emerald: #10B981;
      --amber: #F59E0B;
      --rose: #F43F5E;
      --phone-w: 390px;
      --phone-h: 844px;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ─── TOPBAR ─────────────────────────────────────── */
    .topbar {
      height: 60px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: var(--primary-gradient);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      color: white;
      box-shadow: 0 0 16px rgba(14, 165, 233, 0.4);
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .brand-badge {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(14, 165, 233, 0.15);
      color: #38BDF8;
      border: 1px solid rgba(14, 165, 233, 0.3);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-pill {
      background: var(--bg-panel-elevated);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 7px 14px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-pill:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-pill.active {
      background: #0EA5E9;
      color: white;
      border-color: #38BDF8;
      box-shadow: 0 0 14px rgba(14, 165, 233, 0.35);
    }

    .btn-pill-primary {
      background: var(--primary-gradient);
      color: white;
      border: none;
      box-shadow: 0 2px 12px rgba(14, 165, 233, 0.3);
    }

    /* ─── MAIN LAYOUT ────────────────────────────────── */
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* ─── SIDEBAR ────────────────────────────────────── */
    .sidebar {
      width: 360px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 10;
    }

    .sidebar-search {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .search-input {
      width: 100%;
      background: var(--bg-canvas);
      border: 1px solid var(--border-color);
      padding: 9px 14px;
      border-radius: var(--radius-sm);
      color: white;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .sidebar-list::-webkit-scrollbar {
      width: 5px;
    }

    .sidebar-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    .category-group {
      margin-bottom: 20px;
    }

    .category-header {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .category-header-count {
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 10px;
    }

    .screen-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.18s ease;
      margin-bottom: 3px;
      border: 1px solid transparent;
    }

    .screen-item:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .screen-item.active {
      background: rgba(14, 165, 233, 0.12);
      border-color: rgba(14, 165, 233, 0.35);
    }

    .screen-item-thumb {
      width: 44px;
      height: 60px;
      border-radius: 6px;
      background: #020617;
      border: 1px solid var(--border-color);
      overflow: hidden;
      flex-shrink: 0;
    }

    .screen-item-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }

    .screen-item-content {
      flex: 1;
      min-width: 0;
    }

    .screen-item-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .screen-item-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ─── CANVAS (CENTER) ────────────────────────────── */
    .canvas-viewport {
      flex: 1;
      overflow: auto;
      background: radial-gradient(#1e293b 1px, transparent 1px);
      background-size: 24px 24px;
      background-color: var(--bg-canvas);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      position: relative;
    }

    .canvas-viewport::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .canvas-viewport::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
    }

    .screen-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 100%;
    }

    .screen-meta-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      padding: 8px 18px;
      border-radius: 30px;
      margin-bottom: 24px;
      font-size: 13px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .screen-meta-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
    }

    /* ─── PHONE MOCKUP FRAME ─────────────────────────── */
    .phone-mockup {
      width: 390px;
      height: 844px;
      background: #000;
      border-radius: 48px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8),
                  0 0 0 10px #1E293B,
                  0 0 0 12px #334155;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
    }

    .phone-mockup.full-mode {
      height: auto;
      max-height: none;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7),
                  0 0 0 1px var(--border-color);
    }

    .phone-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 28px;
      background: #000;
      border-radius: 20px;
      z-index: 50;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .phone-mockup.full-mode .phone-island {
      display: none;
    }

    .phone-screen-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      scroll-behavior: smooth;
    }

    .phone-screen-container::-webkit-scrollbar {
      width: 4px;
    }

    .phone-screen-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .phone-screen-image {
      width: 100%;
      display: block;
    }

    /* ─── GRID CANVAS VIEW (Figma Multi-Board Mode) ──── */
    .grid-view-container {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 32px;
      width: 100%;
      max-width: 1600px;
    }

    .grid-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
    }

    .grid-card:hover {
      transform: translateY(-6px);
      border-color: var(--primary);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(14, 165, 233, 0.15);
    }

    .grid-card-preview {
      height: 480px;
      background: #020617;
      overflow: hidden;
      position: relative;
    }

    .grid-card-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      transition: transform 0.3s ease;
    }

    .grid-card:hover .grid-card-preview img {
      transform: scale(1.02);
    }

    .grid-card-body {
      padding: 18px;
    }

    .grid-card-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      color: #38BDF8;
      background: rgba(14, 165, 233, 0.15);
      padding: 2px 8px;
      border-radius: 12px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .grid-card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .grid-card-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* ─── REVIEWER FEEDBACK DRAWER ────────────────────── */
    .feedback-drawer {
      width: 360px;
      background: var(--bg-panel);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 10;
    }

    .feedback-header {
      padding: 18px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .feedback-header h3 {
      font-size: 15px;
      font-weight: 700;
    }

    .feedback-body {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .feedback-textarea {
      width: 100%;
      height: 120px;
      background: var(--bg-canvas);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px;
      color: white;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      outline: none;
    }

    .feedback-textarea:focus {
      border-color: var(--primary);
    }

    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .note-card {
      background: var(--bg-canvas);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px;
      font-size: 12px;
    }

    .note-card-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-weight: 600;
      color: #38BDF8;
    }

    .note-card-text {
      color: var(--text-main);
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">ABC</div>
      <div>
        <div class="brand-title">ABC PHARMACY • MOBILE UI SHOWCASE</div>
      </div>
      <span class="brand-badge">68 Màn hình & Modal</span>
    </div>

    <div class="toolbar-actions">
      <button class="btn-pill" id="btn-toggle-view" onclick="toggleViewMode()">
        <span>📐 Chế độ: <strong>Thanh cuộn Phone</strong></span>
      </button>
      <button class="btn-pill" id="btn-toggle-grid" onclick="toggleGridMode()">
        <span>🗂️ Xem dạng Lưới Gallery</span>
      </button>
      <button class="btn-pill btn-pill-primary" onclick="copyAllFeedback()">
        <span>📋 Xuất Báo Cáo Góp Ý</span>
      </button>
    </div>
  </header>

  <!-- MAIN WRAPPER -->
  <div class="main-container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-search">
        <input type="text" class="search-input" id="search-input" placeholder="🔍 Tìm kiếm màn hình / modal..." oninput="handleSearch(this.value)">
      </div>
      <div class="sidebar-list" id="sidebar-list">
        <!-- Rendered by JS -->
      </div>
    </aside>

    <!-- CENTER CANVAS -->
    <main class="canvas-viewport" id="canvas-viewport">
      
      <!-- SINGLE STAGE VIEW -->
      <div class="screen-stage" id="screen-stage">
        <div class="screen-meta-badge">
          <span class="dot"></span>
          <span id="stage-screen-category">Khách hàng</span> • 
          <strong id="stage-screen-title">Trang Chủ Khách Hàng</strong>
          <span style="color: var(--text-muted); font-size: 11px;" id="stage-screen-dims">(412 x 915)</span>
        </div>

        <div class="phone-mockup" id="phone-mockup">
          <div class="phone-island"></div>
          <div class="phone-screen-container" id="phone-screen-container">
            <img src="auth_splash_phone.png" alt="Screen Preview" class="phone-screen-image" id="stage-screen-img">
          </div>
        </div>
      </div>

      <!-- MULTI GRID VIEW -->
      <div class="grid-view-container" id="grid-view-container">
        <!-- Rendered by JS -->
      </div>

    </main>

    <!-- RIGHT DRAWER: FEEDBACK & REVIEW -->
    <aside class="feedback-drawer">
      <div class="feedback-header">
        <h3>Góp Ý Màn Hình Này</h3>
        <span style="font-size: 12px; color: var(--text-muted);" id="notes-counter">0 ghi chú</span>
      </div>
      <div class="feedback-body">
        <div class="form-group">
          <label class="form-label">Màn hình đang chọn:</label>
          <div style="font-size: 13px; font-weight: 700; color: #38BDF8;" id="feedback-screen-name">Trang Chủ Khách Hàng</div>
          <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;" id="feedback-screen-desc">Mô tả chi tiết</div>
        </div>

        <div class="form-group">
          <label class="form-label">Nhận xét / Đề xuất cải thiện:</label>
          <textarea class="feedback-textarea" id="feedback-input" placeholder="Nhập góp ý về màu sắc, bố cục, kích thước font hoặc flow nghiệp vụ..."></textarea>
          <button class="btn-pill" style="margin-top: 8px; justify-content: center; background: #0EA5E9; color: white;" onclick="addFeedback()">
            ➕ Thêm Góp Ý
          </button>
        </div>

        <hr style="border: none; border-top: 1px solid var(--border-color); margin: 8px 0;">

        <div class="form-group">
          <label class="form-label">Danh sách góp ý đã lưu:</label>
          <div class="notes-list" id="notes-list">
            <div style="font-size: 12px; color: var(--text-muted); text-align: center; padding: 20px 0;">
              Chưa có góp ý nào. Hãy chọn màn hình và nhập nhận xét để gửi cho Developer!
            </div>
          </div>
        </div>
      </div>
    </aside>

  </div>

  <script>
    const SCREENS = [
  {
    "id": "auth_splash",
    "name": "Màn Hình Mở Đầu (Splash Screen)",
    "category": "1. Xác thực & Tài khoản",

    "url": "/?screen=ForgotPasswordScreen",

    "url": "/?screen=ProfileScreen",

  {

  },
  {
    "id": "user_profile_password",
    "name": "Modal: Đổi Mật Khẩu Tài Khoản",
    "category": "2. Hồ sơ cá nhân & Nhân sự",
    "description": "Hộp thoại đổi mật khẩu với xác thực mật khẩu hiện tại và mật khẩu mới",
    "url": "/?screen=ProfileScreen&modal=password",
    "role": "customer",
    "hasFullPage": false,
    "phoneImage": "user_profile_password_phone.png",
    "fullImage": "user_profile_password_phone.png",
    "pageHeight": 915
  },
  {
    "id": "user_profile_cert",
    "name": "Modal: Chứng Chỉ & Bằng Cấp (CCHN)",
    "category": "2. Hồ sơ cá nhân & Nhân sự",
    "description": "Quản lý văn bằng dược sĩ, số CCHN, ngày cấp, đơn vị cấp và trạng thái phê duyệt phụ cấp",
    "url": "/?screen=ProfileScreen&modal=cert",
    "role": "pharmacist",
    "hasFullPage": false,
    "phoneImage": "user_profile_cert_phone.png",
    "fullImage": "user_profile_cert_phone.png",
    "pageHeight": 915
  },
  {
    "id": "user_profile_schedule",

    let activeScreenIndex = 0;
    let isFullPageMode = false;
    let isGridMode = false;
    let feedbackNotes = [];

    // Khởi tạo Sidebar
    function initSidebar() {
      const listContainer = document.getElementById('sidebar-list');
      listContainer.innerHTML = '';

      const categories = [...new Set(SCREENS.map(s => s.category))];

      categories.forEach(cat => {
        const group = document.createElement('div');
        group.className = 'category-group';

        const count = SCREENS.filter(s => s.category === cat).length;
        const header = document.createElement('div');
        header.className = 'category-header';
        header.innerHTML = `<span>${cat}</span><span class="category-header-count">${count}</span>`;
        group.appendChild(header);

        SCREENS.forEach((s, idx) => {
          if (s.category === cat) {
            const item = document.createElement('div');
            item.className = 'screen-item' + (idx === activeScreenIndex ? ' active' : '');
            item.id = 'screen-item-' + idx;
            item.onclick = () => selectScreen(idx);

            item.innerHTML = `
              <div class="screen-item-thumb">
                <img src="${s.phoneImage}" alt="${s.name}">
              </div>
              <div class="screen-item-content">
                <div class="screen-item-title">${s.name}</div>
                <div class="screen-item-sub">${s.id}</div>
              </div>
            `;

            group.appendChild(item);
          }
        });

        listContainer.appendChild(group);
      });
    }

    // Chọn màn hình
    function selectScreen(index) {
      activeScreenIndex = index;
      const screen = SCREENS[index];

      // Update sidebar active state
      document.querySelectorAll('.screen-item').forEach((el, idx) => {
        el.classList.toggle('active', el.id === 'screen-item-' + index);
      });

      // Update Stage
      document.getElementById('stage-screen-category').textContent = screen.category;
      document.getElementById('stage-screen-title').textContent = screen.name;
      document.getElementById('stage-screen-dims').textContent = isFullPageMode ? `(412 x ${screen.pageHeight}px Full)` : '(412 x 915px Phone)';
      
      const img = document.getElementById('stage-screen-img');
      img.src = isFullPageMode ? screen.fullImage : screen.phoneImage;

      // Reset scroll top of phone
      document.getElementById('phone-screen-container').scrollTop = 0;

      // Update Feedback drawer
      document.getElementById('feedback-screen-name').textContent = screen.name;
      document.getElementById('feedback-screen-desc').textContent = screen.description;

      if (isGridMode) {
        toggleGridMode(); // Switch back to stage view when clicking item
      }
    }

    // Đổi chế độ xem: Full Page vs Phone Frame
    function toggleViewMode() {
      isFullPageMode = !isFullPageMode;
      const mockup = document.getElementById('phone-mockup');
      const btn = document.getElementById('btn-toggle-view');

      if (isFullPageMode) {
        mockup.classList.add('full-mode');
        btn.innerHTML = '<span>📜 Chế độ: <strong>Ảnh dài Full Page</strong></span>';
        btn.classList.add('active');
      } else {
        mockup.classList.remove('full-mode');
        btn.innerHTML = '<span>📐 Chế độ: <strong>Thanh cuộn Phone</strong></span>';
        btn.classList.remove('active');
      }

      selectScreen(activeScreenIndex);
    }

    // Đổi chế độ Lưới (Grid Figma boards)
    function toggleGridMode() {
      isGridMode = !isGridMode;
      const stage = document.getElementById('screen-stage');
      const grid = document.getElementById('grid-view-container');
      const btn = document.getElementById('btn-toggle-grid');

      if (isGridMode) {
        stage.style.display = 'none';
        grid.style.display = 'grid';
        btn.classList.add('active');
        renderGrid();
      } else {
        stage.style.display = 'flex';
        grid.style.display = 'none';
        btn.classList.remove('active');
      }
    }

    function renderGrid() {
      const grid = document.getElementById('grid-view-container');
      grid.innerHTML = '';

      SCREENS.forEach((s, idx) => {
        const card = document.createElement('div');
        card.className = 'grid-card';
        card.onclick = () => {
          selectScreen(idx);
          toggleGridMode();
        };

        card.innerHTML = `
          <div class="grid-card-preview">
            <img src="${s.phoneImage}" alt="${s.name}">
          </div>
          <div class="grid-card-body">
            <span class="grid-card-badge">${s.category}</span>
            <div class="grid-card-title">${s.name}</div>
            <div class="grid-card-desc">${s.description}</div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // Thêm góp ý
    function addFeedback() {
      const input = document.getElementById('feedback-input');
      const text = input.value.trim();
      if (!text) return;

      const screen = SCREENS[activeScreenIndex];
      feedbackNotes.push({
        screenId: screen.id,
        screenName: screen.name,
        category: screen.category,
        comment: text,
        timestamp: new Date().toLocaleTimeString('vi-VN')
      });

      input.value = '';
      renderNotes();
    }

    function renderNotes() {
      const list = document.getElementById('notes-list');
      document.getElementById('notes-counter').textContent = feedbackNotes.length + ' ghi chú';

      if (feedbackNotes.length === 0) {
        list.innerHTML = '<div style="font-size: 12px; color: var(--text-muted); text-align: center; padding: 20px 0;">Chưa có góp ý nào.</div>';
        return;
      }

      list.innerHTML = feedbackNotes.map((n, i) => `
        <div class="note-card">
          <div class="note-card-header">
            <span>${n.screenName}</span>
            <span style="color: var(--text-muted); font-size: 10px;">${n.timestamp}</span>
          </div>
          <div class="note-card-text">${n.comment}</div>
        </div>
      `).join('');
    }

    // Xuất báo cáo góp ý
    function copyAllFeedback() {
      if (feedbackNotes.length === 0) {
        alert('Chưa có góp ý nào để xuất. Hãy nhập ít nhất một ghi chú góp ý!');
        return;
      }

      let report = '# BÁO CÁO GÓP Ý GIAO DIỆN ABC PHARMACY MOBILE APP\n\n';
      feedbackNotes.forEach((n, i) => {
        report += `### ${i + 1}. [${n.category}] ${n.screenName} (${n.screenId})\n`;
        report += `- Thời gian: ${n.timestamp}\n`;
        report += `- Nhận xét: ${n.comment}\n\n`;
      });

      navigator.clipboard.writeText(report).then(() => {
        alert('✅ Đã sao chép toàn bộ ' + feedbackNotes.length + ' góp ý vào Clipboard! Bạn có thể dán (Ctrl+V) gửi cho Developer.');
      });
    }

    // Tìm kiếm
    function handleSearch(q) {
      const query = q.toLowerCase();
      document.querySelectorAll('.screen-item').forEach(el => {
        const title = el.querySelector('.screen-item-title').textContent.toLowerCase();
        const sub = el.querySelector('.screen-item-sub').textContent.toLowerCase();
        el.style.display = (title.includes(query) || sub.includes(query)) ? 'flex' : 'none';
      });
    }

    // Bắt phím điều hướng (Arrow Left / Right)
    window.addEventListener('keydown', (e) => {
      if (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        if (activeScreenIndex < SCREENS.length - 1) selectScreen(activeScreenIndex + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        if (activeScreenIndex > 0) selectScreen(activeScreenIndex - 1);
      }
    });

    // Start
    initSidebar();
    selectScreen(0);
  </script>
