<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3E5E9E"/></marker></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="white" stroke="none"/><rect x="96" y="64" width="1728" height="104" rx="52" fill="#3E5E9E" stroke="none"/><text x="152" y="132" font-family="Arial, sans-serif" font-size="42" fill="white" font-weight="700" text-anchor="start">Software Development Model: Scrum</text><text x="96" y="231" font-family="Arial, sans-serif" font-size="32" fill="#62758D" font-weight="400" text-anchor="start">An iterative cycle for selecting, delivering and improving work</text><rect x="96" y="285" width="480" height="180" rx="0" fill="white" stroke="#D8E2EE"/><rect x="96" y="285" width="7" height="180" rx="0" fill="#087F82" stroke="none"/><text x="126" y="338" font-family="Arial, sans-serif" font-size="34" fill="#18335B" font-weight="700" text-anchor="start">Product Backlog</text><text x="126" y="389" font-family="Arial, sans-serif" font-size="27" fill="#233A55" font-weight="400" text-anchor="start">Ordered product work</text><text x="126" y="428" font-family="Arial, sans-serif" font-size="27" fill="#233A55" font-weight="400" text-anchor="start">aligned with the Product Goal.</text><rect x="720" y="285" width="480" height="180" rx="0" fill="white" stroke="#D8E2EE"/><rect x="720" y="285" width="7" height="180" rx="0" fill="#087F82" stroke="none"/><text x="750" y="338" font-family="Arial, sans-serif" font-size="34" fill="#18335B" font-weight="700" text-anchor="start">Sprint Planning</text><text x="750" y="389" font-family="Arial, sans-serif" font-size="27" fill="#233A55" font-weight="400" text-anchor="start">Agree on a Sprint Goal</text><text x="750" y="428" font-family="Arial, sans-serif" font-size="27" fill="#233A55" font-weight="400" text-anchor="start">and select achievable work.</text><rect x="1344" y="285" width="480" height="180" rx="0" fill="white" stroke="#D8E2EE"/><rect x="1344" y="285" width="7" height="180" rx="0" fill="#087F82" stroke="none"/><text x="1374" y="338" font-family="Arial, sans-serif" font-size="34" fill="#18335B" font-weight="700" text-anchor="start">Sprint Backlog</text><text x="1374" y="389" font-family="Arial, sans-serif" font-size="27" fill="#233A55" font-weight="400" text-anchor="start">Goal, selected items</text><text x="1374" y="428" font-family="Arial, sans-serif" font-size="27" fill="#233A55" font-weight="400" text-anchor="start">and the delivery plan.</text><path d="M588 375 H706" fill="none" stroke="#3E5E9E" stroke-width="4" marker-end="url(#arrow)"/><path d="M1212 375 H1330" fill="none" stroke="#3E5E9E" stroke-width="4" marker-end="url(#arrow)"/><path d="M1584 477 V563" fill="none" stroke="#3E5E9E" stroke-width="4" marker-end="url(#arrow)"/><rect x="1344" y="575" width="480" height="270" rx="0" fill="white" stroke="#D8E2EE"/><rect x="1344" y="575" width="7" height="270" rx="0" fill="#087F82" stroke="none"/><text x="1374" y="628" font-family="Arial, sans-serif" font-size="34" fill="#18335B" font-weight="700" text-anchor="start">During the Sprint</text><text x="1374" y="679" font-family="Arial, sans-serif" font-size="27" fill="#233A55" font-weight="400" text-anchor="start">Build, integrate and test.</text><text x="1374" y="718" font-family="Arial, sans-serif" font-size="27" fill="#233A55" font-weight="400" text-anchor="start">Daily Scrum: inspect progress</text><text x="1374" y="757" font-family="Arial, sans-serif" font-size="27" fill="#233A55" font-weight="400" text-anchor="start">and adapt the work plan.</text><text x="1374" y="796" font-family="Arial, sans-serif" font-size="27" fill="#233A55" font-weight="400" text-anchor="start">Output: a usable increment.</text><rect x="720" y="575" width="480" height="180" rx="0" fill="white" stroke="#D8E2EE"/><rect x="720" y="575" width="7" height="180" rx="0" fill="#087F82" stroke="none"/><text x="750" y="628" font-family="Arial, sans-serif" font-size="34" fill="#18335B" font-weight="700" text-anchor="start">Sprint Review</text><text x="750" y="679" font-family="Arial, sans-serif" font-size="27" fill="#233A55" font-weight="400" text-anchor="start">Inspect results with stakeholders</text><text x="750" y="718" font-family="Arial, sans-serif" font-size="27" fill="#233A55" font-weight="400" text-anchor="start">and update future work.</text><rect x="96" y="575" width="480" height="180" rx="0" fill="white" stroke="#D8E2EE"/><rect x="96" y="575" width="7" height="180" rx="0" fill="#087F82" stroke="none"/><text x="126" y="628" font-family="Arial, sans-serif" font-size="34" fill="#18335B" font-weight="700" text-anchor="start">Sprint Retrospective</text><text x="126" y="679" font-family="Arial, sans-serif" font-size="27" fill="#233A55" font-weight="400" text-anchor="start">Inspect the way the team works</text><text x="126" y="718" font-family="Arial, sans-serif" font-size="27" fill="#233A55" font-weight="400" text-anchor="start">and choose improvements.</text><path d="M1332 665 H1214" fill="none" stroke="#3E5E9E" stroke-width="4" marker-end="url(#arrow)"/><path d="M708 665 H590" fill="none" stroke="#3E5E9E" stroke-width="4" marker-end="url(#arrow)"/><path d="M336 767 V916 H52 V375 H82" fill="none" stroke="#3E5E9E" stroke-width="4" marker-end="url(#arrow)"/><text x="570" y="931" font-family="Arial, sans-serif" font-size="29" fill="#3E5E9E" font-weight="700" text-anchor="start">Feedback and improvements inform the next Sprint</text><line x1="96" y1="990" x2="1824" y2="990" stroke="#D8E2EE" stroke-width="2"/><text x="96" y="1030" font-family="Arial, sans-serif" font-size="24" fill="#62758D" font-weight="400" text-anchor="start">Conceptual illustration based on the Scrum Guide (scrumguides.org). Add your actual sprint duration.</text></svg>