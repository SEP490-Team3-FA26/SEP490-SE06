ext x="1089" y="412" font-family="Arial, sans-serif" font-size="32" fill="#233A55" font-weight="400" text-anchor="start">received in Review 1.</text><line x1="1089" y1="465" x2="1790" y2="465" stroke="#D8E2EE" stroke-width="2"/><text x="96" y="540" font-family="Arial, sans-serif" font-size="54" fill="#087F82" font-weight="700" text-anchor="start">03</text><text x="201" y="540" font-family="Arial, sans-serif" font-size="38" fill="#18335B" font-weight="700" text-anchor="start">Project control</text><text x="201" y="606" font-family="Arial, sans-serif" font-size="32" fill="#233A55" font-weight="400" text-anchor="start">Keep Jira, sprint plans and</text><text x="201" y="654" font-family="Arial, sans-serif" font-size="32" fill="#233A55" font-weight="400" text-anchor="start">project reports consistent.</text><text x="201" y="702" font-family="Arial, sans-serif" font-size="32" fill="#233A55" font-weight="400" text-anchor="start">Assign clear task ownership.</text><line x1="201" y1="755" x2="902" y2="755" stroke="#D8E2EE" stroke-width="2"/><text x="984" y="540" font-family="Arial, sans-serif" font-size="54" fill="#087F82" font-weight="700" text-anchor="start">04</text><text x="1089" y="540" font-family="Arial, sans-serif" font-size="38" fill="#18335B" font-weight="700" text-anchor="start">Quality and evidence</text><text x="1089" y="606" font-family="Arial, sans-serif" font-size="32" fill="#233A55" font-weight="400" text-anchor="start">Validate critical workflows.</text><text x="1089" y="654" font-family="Arial, sans-serif" font-size="32" fill="#233A55" font-weight="400" text-anchor="start">Link requirements to code,</text><text x="1089" y="702" font-family="Arial, sans-serif" font-size="32" fill="#233A55" font-weight="400" text-anchor="start">test results and demo evidence.</text><line x1="1089" y1="755" x2="1790" y2="755" stroke="#D8E2EE" stroke-width="2"/><line x1="96" y1="990" x2="1824" y2="990" stroke="#D8E2EE" stroke-width="2"/><text x="96" y="1030" font-family="Arial, sans-serif" font-size="24" fill="#62758D" font-weight="400" text-anchor="start">Proposed presentation content. Confirm objectives against the approved project scope.</text></svg>