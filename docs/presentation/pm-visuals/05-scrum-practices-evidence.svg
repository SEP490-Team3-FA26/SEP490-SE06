<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3E5E9E"/></marker></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="white" stroke="none"/><rect x="96" y="64" width="1728" height="104" rx="52" fill="#3E5E9E" stroke="none"/><text x="152" y="132" font-family="Arial, sans-serif" font-size="42" fill="white" font-weight="700" text-anchor="start">Scrum Practices in Our Project</text><text x="96" y="230" font-family="Arial, sans-serif" font-size="32" fill="#62758D" font-weight="400" text-anchor="start">Connect each practice to an actual project record</text><rect x="96" y="269" width="1728" height="66" rx="0" fill="#EDF3FA" stroke="none"/><text x="122" y="313" font-family="Arial, sans-serif" font-size="28" fill="#18335B" font-weight="700" text-anchor="start">Practice</text><text x="610" y="313" font-family="Arial, sans-serif" font-size="28" fill="#18335B" font-weight="700" text-anchor="start">Purpose</text><text x="1360" y="313" font-family="Arial, sans-serif" font-size="28" fill="#18335B" font-weight="700" text-anchor="start">Evidence to attach</text><text x="122" y="389" font-family="Arial, sans-serif" font-size="30" fill="#18335B" font-weight="700" text-anchor="start">Product Backlog</text><text x="610" y="389" font-family="Arial, sans-serif" font-size="28" fill="#233A55" font-weight="400" text-anchor="start">Keep product work ordered.</text><text x="1360" y="389" font-family="Arial, sans-serif" font-size="27" fill="#087F82" font-weight="700" text-anchor="start">Jira backlog</text><line x1="96" y1="419" x2="1824" y2="419" stroke="#D8E2EE" stroke-width="2"/><text x="122" y="477" font-family="Arial, sans-serif" font-size="30" fill="#18335B" font-weight="700" text-anchor="start">Sprint Planning</text><text x="610" y="477" font-family="Arial, sans-serif" font-size="28" fill="#233A55" font-weight="400" text-anchor="start">Set a goal and select the work.</text><text x="1360" y="477" font-family="Arial, sans-serif" font-size="27" fill="#087F82" font-weight="700" text-anchor="start">Sprint Goal and scope</text><line x1="96" y1="507" x2="1824" y2="507" stroke="#D8E2EE" stroke-width="2"/><text x="122" y="565" font-family="Arial, sans-serif" font-size="30" fill="#18335B" font-weight="700" text-anchor="start">Sprint Backlog</text><text x="610" y="565" font-family="Arial, sans-serif" font-size="28" fill="#233A55" font-weight="400" text-anchor="start">Plan delivery of selected items.</text><text x="1360" y="565" font-family="Arial, sans-serif" font-size="27" fill="#087F82" font-weight="700" text-anchor="start">Sprint board</text><line x1="96" y1="595" x2="1824" y2="595" stroke="#D8E2EE" stroke-width="2"/><text x="122" y="653" font-family="Arial, sans-serif" font-size="30" fill="#18335B" font-weight="700" text-anchor="start">Daily Scrum</text><text x="610" y="653" font-family="Arial, sans-serif" font-size="28" fill="#233A55" font-weight="400" text-anchor="start">Inspect progress and adapt the plan.</text><text x="1360" y="653" font-family="Arial, sans-serif" font-size="27" fill="#087F82" font-weight="700" text-anchor="start">Blockers and next actions</text><line x1="96" y1="683" x2="1824" y2="683" stroke="#D8E2EE" stroke-width="2"/><text x="122" y="741" font-family="Arial, sans-serif" font-size="30" fill="#18335B" font-weight="700" text-anchor="start">Sprint Review</text><text x="610" y="741" font-family="Arial, sans-serif" font-size="28" fill="#233A55" font-weight="400" text-anchor="start">Inspect the outcome with stakeholders.</text><text x="1360" y="741" font-family="Arial, sans-serif" font-size="27" fill="#087F82" font-weight="700" text-anchor="start">Demo and feedback notes</text><line x1="96" y1="771" x2="1824" y2="771" stroke="#D8E2EE" stroke-width="2"/><text x="122" y="829" font-family="Arial, sans-serif" font-size="30" fill="#18335B" font-weight="700" text-anchor="start">Sprint Retrospective</text><text x="610" y="829" font-family="Arial, sans-serif" font-size="28" fill="#233A55" font-weight="400" text-anchor="start">Improve team effectiveness.</text><text x="1360" y="829" font-family="Arial, sans-serif" font-size="27" fill="#087F82" font-weight="700" text-anchor="start">Improvement action log</text><line x1="96" y1="859" x2="1824" y2="859" stroke="#D8E2EE" stroke-width="2"/><text x="96" y="960" font-family="Arial, sans-serif" font-size="29" fill="#3E5E9E" font-weight="700" text-anchor="start">Use real records from one Sprint to explain the complete cycle.</text><line x1="96" y1="990" x2="1824" y2="990" stroke="#D8E2EE" stroke-width="2"/><text x="96" y="1030" font-family="Arial, sans-serif" font-size="24" fill="#62758D" font-weight="400" text-anchor="start">Suggested evidence only. Attach actual records. Scrum concepts: scrumguides.org/scrum-guide.html.</text></svg>