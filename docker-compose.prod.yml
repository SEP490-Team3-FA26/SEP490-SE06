# ============================================================
# Production stack — 10 bounded contexts as separate services
# Optimized for VPS with 6GB RAM
#
# Usage:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# ============================================================

x-backend-common: &backend-common
  image: ${ECR_REGISTRY}/wdp301-backend:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file:
    - .env
  environment: &backend-env
    NODE_ENV: production
    REDIS_HOST: redis
    REDIS_PORT: 6379
    KAFKA_BROKERS: kafka:29092
    NODE_OPTIONS: "--max-old-space-size=256"
  depends_on:
    kafka:
      condition: service_healthy
    redis:
      condition: service_started
  networks: [wdp301-network]

services:
  # ──────────────────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: wdp301-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks: [wdp301-network]

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: wdp301-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG4J_ROOT_LOGLEVEL: 'ERROR'
      KAFKA_HEAP_OPTS: '-Xmx256m -Xms128m'
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 45s
    networks: [wdp301-network]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: wdp301-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__CLUSTER__ENABLED: "false"
    networks: [wdp301-network]

  # ──────────────────────────────────────────────────────────
  # Bounded Context Services (10 services)
  # ──────────────────────────────────────────────────────────

  # 1. API Gateway — entry point
  api-gateway:
    <<: *backend-common
    container_name: wdp301-gateway
    command: node dist/apps/api-gateway/main.js
    ports:
      - "4000:4000"
    environment:
      <<: *backend-env
      PORT: 4000

  # 2. Auth Service — identity & access
  auth-service:
    <<: *backend-common
    container_name: wdp301-auth
    command: node dist/apps/auth-service/main.js

  # 3. User Service — customer profiles
  user-service:
    <<: *backend-common
    container_name: wdp301-user
    command: node dist/apps/user-service/main.js

  # 4. Inventory Service — warehouse & stock
  inventory-service:
    <<: *backend-common
    container_name: wdp301-inventory
    command: node dist/apps/inventory-service/main.js

  # 5. Supplier Service — procurement & NCC
  supplier-service:
    <<: *backend-common
    container_name: wdp301-supplier
    command: node dist/apps/supplier-service/main.js

  # 6. Orders Service — sales & POS
  orders-service:
    <<: *backend-common
    container_name: wdp301-orders
    command: node dist/apps/orders-service/main.js

  # 7. Finance Service — accounting & cash flow
  finance-service:
    <<: *backend-common
    container_name: wdp301-finance
    command: node dist/apps/finance-service/main.js

  # 8. Marketing Service — promotions & loyalty
  marketing-service:
    <<: *backend-common
    container_name: wdp301-marketing
    command: node dist/apps/marketing-service/main.js

  # 9. Customer Service — CRM & care
  customer-service:
    <<: *backend-common
    container_name: wdp301-customer
    command: node dist/apps/customer-service/main.js

  # 10. AI Service — self-hosted, no third-party API
  ai-service:
    build:
      context: .
      dockerfile: backend/apps/ai-service/Dockerfile
    container_name: wdp301-ai
    restart: unless-stopped
    env_file:
      - .env
      - backend/apps/ai-service/.env
    environment:
      QDRANT_HOST: qdrant
      NODE_OPTIONS: "--max-old-space-size=512"
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - kafka
    networks: [wdp301-network]
    deploy:
      resources:
        limits:
          memory: 1g

  # ──────────────────────────────────────────────────────────
  # Reporting Service (read-model, lightweight)
  # ──────────────────────────────────────────────────────────
  reporting-service:
    <<: *backend-common
    container_name: wdp301-reporting
    command: node dist/apps/reporting-service/main.js
    environment:
      <<: *backend-env
      NODE_OPTIONS: "--max-old-space-size=128"

networks:
  wdp301-network:
    driver: bridge

volumes:
  redis_data:
  qdrant_data:
