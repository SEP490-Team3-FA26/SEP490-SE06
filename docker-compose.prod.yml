# ============================================================
# Production stack — 10 bounded contexts as separate services
# Optimized for VPS with 6GB RAM
#
# Usage:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# ============================================================

x-backend-common: &backend-common
  image: ${BACKEND_IMAGE:-wdp301-backend:latest}
  pull_policy: never
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
    - path: backend/.env
      required: false
  environment: &backend-env
    NODE_ENV: production
    REDIS_HOST: redis
    REDIS_PORT: 6379
    KAFKA_BROKERS: kafka:29092
    NODE_OPTIONS: "--max-old-space-size=256"
  depends_on:
    kafka:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "pidof node > /dev/null || exit 1"]
    interval: 20s
    timeout: 5s
    retries: 3
    start_period: 30s
  deploy:
    resources:
      limits:
        memory: 384m
  networks:
    wdp301-network:

services:
  # ──────────────────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: wdp301-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [wdp301-network]

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: wdp301-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG4J_ROOT_LOGLEVEL: 'ERROR'
      KAFKA_HEAP_OPTS: '-Xmx256m -Xms128m'
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 768m
    networks: [wdp301-network]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: wdp301-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__CLUSTER__ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 384m
    networks: [wdp301-network]

  # ──────────────────────────────────────────────────────────
  # Bounded Context Services (NestJS Microservices)
  # ──────────────────────────────────────────────────────────

  # 1. API Gateway — entry point
  api-gateway:
    <<: *backend-common
    container_name: wdp301-gateway
    command: node dist/apps/api-gateway/main.js
    ports:
      - "4000:4000"
    environment:
      <<: *backend-env
      PORT: 4000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      wdp301-network:
        aliases:
          - backend-svc

  # 2. Auth Service — identity & access
  auth-service:
    <<: *backend-common
    container_name: wdp301-auth
    command: node dist/apps/auth-service/main.js

  # 3. User Service — customer profiles
  user-service:
    <<: *backend-common
    container_name: wdp301-user
    command: node dist/apps/user-service/main.js

  # 4. Inventory Service — warehouse & stock
  inventory-service:
    <<: *backend-common
    container_name: wdp301-inventory
    command: node dist/apps/inventory-service/main.js

  # 5. Supplier Service — procurement & NCC
  supplier-service:
    <<: *backend-common
    container_name: wdp301-supplier
    command: node dist/apps/supplier-service/main.js

  # 6. Orders Service — sales & POS
  orders-service:
    <<: *backend-common
    container_name: wdp301-orders
    command: node dist/apps/orders-service/main.js

  # 7. AI Service — self-hosted, no third-party API (Pre-built image)
  ai-service:
    image: ${AI_IMAGE:-wdp301-ai:latest}
    pull_policy: never
    container_name: wdp301-ai
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
      - path: backend/apps/ai-service/.env
        required: false
    environment:
      QDRANT_HOST: qdrant
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - kafka
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [wdp301-network]

  # ──────────────────────────────────────────────────────────
  # Frontend Web (React / Vite + Nginx Reverse Proxy)
  # ──────────────────────────────────────────────────────────
  frontend:
    image: ${FRONTEND_IMAGE:-wdp301-frontend:latest}
    pull_policy: never
    container_name: wdp301-frontend
    restart: unless-stopped
    ports:
      - "80:3000"
      - "443:443"
      - "3000:3000"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - ./backend/docker/nginx.frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/ > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [wdp301-network]

  # ──────────────────────────────────────────────────────────
  # Monitoring (Production Stack: Dozzle + Node Exporter + Prometheus + Grafana)
  # ──────────────────────────────────────────────────────────
  dozzle:
    image: amir20/dozzle:latest
    container_name: wdp301-dozzle
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_LEVEL: info
      DOZZLE_NO_ANALYTICS: "true"
    deploy:
      resources:
        limits:
          memory: 64m
    networks: [wdp301-network]

  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: wdp301-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    deploy:
      resources:
        limits:
          memory: 32m
    networks: [wdp301-network]

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: wdp301-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.wal-compression'
      - '--web.enable-lifecycle'
    volumes:
      - ./gitops/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api-gateway
      - node-exporter
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [wdp301-network]

  grafana:
    image: grafana/grafana:10.4.0
    container_name: wdp301-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=wdp301admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/system-and-api-overview.json
    volumes:
      - ./gitops/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./gitops/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [wdp301-network]

networks:
  wdp301-network:
    name: wdp301-network
    driver: bridge

volumes:
  redis_data:
  qdrant_data:
  prometheus_data:
